[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-validator"
version = "0.2.0"
description = "Map-driven, ID-preserving migration of extended 10.98 OpenTibia assets"
requires-python = ">=3.11"

[project.scripts]
asset-validator = "asset_validator.__main__:main"

[tool.setuptools.packages.find]
include = ["asset_validator*"]
